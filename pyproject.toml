[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-deidentifier"
version = "1.0.0"
description = "DICOM PHI tag and burned-in text de-identification pipeline for radiology images"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Datakaveri / SPIDEr Contributors" }
]
dependencies = [
    "pydicom>=2.4.4,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "scikit-image>=0.22.0,<1.0.0",
    "pylibjpeg>=2.0.0,<3.0.0",
    "pylibjpeg-libjpeg>=2.0.0,<3.0.0",
    "pylibjpeg-openjpeg>=2.0.0,<3.0.0",
    "pylibjpeg-rle>=2.0.0,<3.0.0",
    "opencv-python-headless>=4.9.0.80,<5.0.0.0",
    "Pillow>=10.0.0,<11.0.0",
    "shapely>=2.0.0,<3.0.0",
    "pyclipper>=1.3.0,<2.0.0",
    "paddleocr>=2.8.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
    "gliner>=0.2.0,<1.0.0",
    "presidio-analyzer>=2.2.354,<3.0.0",
    "spacy>=3.7.4,<3.8.0",
    "pycryptodome>=3.20.0,<4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<1.0.0",
    "black>=24.0.0,<25.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-v --strict-markers"
