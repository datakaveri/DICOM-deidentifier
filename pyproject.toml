[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-deidentifier"
version = "1.0.0"
description = "DICOM PHI tag and burned-in text de-identification pipeline for radiology images"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Datakaveri / SPIDEr Contributors" }
]
dependencies = [
    "pydicom>=2.4.5,<3.0.0",  # 2.4.5 fixes CVE-2026-32711
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "scikit-image>=0.22.0,<1.0.0",
    "pylibjpeg>=2.0.0,<3.0.0",
    "pylibjpeg-libjpeg>=2.0.0,<3.0.0",
    "pylibjpeg-openjpeg>=2.0.0,<3.0.0",
    "pylibjpeg-rle>=2.0.0,<3.0.0",
    "opencv-python-headless>=4.9.0.80,<6.0.0.0",
    "Pillow>=13.0.0,<14.0.0",  # >=13 clears 40+ 2026 advisories
    "shapely>=2.0.0,<3.0.0",
    "pyclipper>=1.3.0,<2.0.0",
    "paddleocr>=2.8.0,<3.0.0",
    "transformers>=5.10.0,<6.0.0",  # 4.x carries unfixed advisories
    "gliner>=0.2.0,<1.0.0",
    "presidio-analyzer>=2.2.354,<3.0.0",
    "spacy>=3.7.4,<3.8.0",
    "pycryptodome>=3.20.0,<4.0.0",
    # Installed from the PyTorch CPU index in the image; see scripts/lock.sh.
    "torch>=2.5.0,<3.0.0",
    "paddlepaddle>=2.6.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",  # 9.0.3 fixes CVE-2025-71176
    "pytest-cov>=6.0.0,<8.0.0",
    "ruff>=0.4.0,<1.0.0",
    "black>=26.10.1,<27.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
    "E702",  # multiple statements on one line (semicolon)
    "F401",  # unused import
    "F841",  # unused variable
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-v --strict-markers"
