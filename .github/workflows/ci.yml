name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA; Dependabot's github-actions
# ecosystem bumps the pin and the version comment together.
jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Same ruff/black versions as requirements-dev.lock, without installing
      # the whole runtime stack just to lint.
      - name: Install linters at the locked versions
        run: |
          ver() { sed -n "s/^$1==\([^ ]*\).*/\1/p" requirements-dev.lock; }
          python -m pip install "ruff==$(ver ruff)" "black==$(ver black)"
      - run: ruff check .
      - run: black --check .

  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # The full locked environment, hash-checked: tests run against exactly
      # the packages the image ships.
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m pip check
      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pip-audit at the locked version
        run: python -m pip install "pip-audit==$(sed -n 's/^pip-audit==\([^ ]*\).*/\1/p' requirements-dev.lock)"
      # Each ignore names the advisory and why it does not apply. Remove the
      # entry as soon as the upgrade that fixes it lands; add none silently.
      #   PYSEC-2026-2266 (CVE-2026-32711, pydicom): GHSA-v856-2rf8-9f28 lists
      #     2.4.5 as patched (backport); the PyPA record only names 3.0.2.
      #   PYSEC-2026-1754 (CVE-2024-0817, paddlepaddle IrGraph.draw) and
      #   PYSEC-2026-1756 (CVE-2024-0815, paddle.utils.download._wget_download):
      #     fixed only in paddlepaddle 3.x, which needs the PaddleOCR 3
      #     migration. Neither function is called by app/; model downloads
      #     happen at image build time only, from fixed URLs, and the runtime
      #     image is offline.
      - name: Audit runtime and dev locks
        run: |
          for lock in requirements.lock requirements-dev.lock; do
            pip-audit --disable-pip --no-deps --progress-spinner off -r "$lock" \
              --ignore-vuln PYSEC-2026-2266 \
              --ignore-vuln PYSEC-2026-1754 \
              --ignore-vuln PYSEC-2026-1756
          done
      # torch is locked as a +cpu local version that PyPI does not list, so
      # pip-audit skips it above; audit the matching upstream release.
      - name: Audit torch by its upstream version
        run: |
          v=$(sed -n 's/^torch==\([0-9.]*\)+cpu.*/\1/p' requirements.lock)
          echo "torch==$v" > torch-upstream.txt
          pip-audit --disable-pip --no-deps --progress-spinner off -r torch-upstream.txt

  docker:
    name: Dockerfile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Lints the Dockerfile without the multi-GB model download; the full
      # build runs in release.yml.
      - run: docker buildx build --check .
