name: Release

# A release is cut by pushing an immutable tag vMAJOR.MINOR.PATCH (the
# "Release tags" ruleset enforces the format and blocks moving or deleting
# it). The tag must equal the version in pyproject.toml and app/__init__.py,
# and CHANGELOG.md must have a section for it. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to decide whether this release is the newest
      - id: v
        name: Tag must equal the package version and have a CHANGELOG entry
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          pkg=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
          if [ "${pkg}" != "${version}" ]; then
            echo "::error::app/__init__.py __version__ ${pkg} does not match pyproject.toml ${version}"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi
          if grep -q "^## \[${version}\] — unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still marks ${version} as unreleased; date it before tagging"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Deployments run :latest, so it must only ever move forward. A patch
      # to an older line (v1.4.3 after v2.0.0 exists) is published under its
      # own version tags but does not take :latest.
      - id: latest
        name: Is this the highest release tag?
        run: |
          highest=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "${highest}" = "${GITHUB_REF_NAME}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_REF_NAME} is not the highest release (${highest}); :latest stays put"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The image name stays skald-dicom, the name SPIDEr deployments already
      # pull. Every release gets its immutable X.Y.Z / vX.Y.Z tags; :latest
      # (what deployments run) moves only when this is the highest release.
      # An empty line in `tags` is ignored.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/datakaveri/skald-dicom:${{ needs.version.outputs.version }}
            ghcr.io/datakaveri/skald-dicom:v${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.latest == 'true' && 'ghcr.io/datakaveri/skald-dicom:latest' || '' }}

  github-release:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract this version's CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Container image"
            echo
            echo '```'
            echo "docker pull ghcr.io/datakaveri/skald-dicom:${VERSION}"
            echo "# digest: ${{ needs.image.outputs.digest }}"
            echo '```'
          } >> notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "DICOM De-Identifier ${VERSION}" \
            --notes-file notes.md --verify-tag --latest="${LATEST}"
