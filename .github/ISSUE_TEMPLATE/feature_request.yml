name: Feature Request
description: Suggest an idea or enhancement for the DICOM de-identifier
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Requirement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capability you would like to see.
    validations:
      required: true
