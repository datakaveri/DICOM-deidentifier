name: Bug Report
description: Create a report to help reproduce and fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please fill out this form with as much detail as possible. Do not include real patient data.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps led to the issue?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
