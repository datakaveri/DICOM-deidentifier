version: 2
updates:
  # Reads pyproject.toml. requirements.lock / requirements-dev.lock are hashed
  # locks that Dependabot cannot regenerate: after merging a bump, run
  # scripts/lock.sh in the same PR (CI's audit job also covers transitive
  # packages Dependabot never sees).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
