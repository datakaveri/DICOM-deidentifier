services:
  dicom-deidentifier:
    build:
      context: .
    image: skald-dicom:dev
    container_name: dicom-deidentifier
    # The image runs as uid 65532; ./output and ./keys must be writable by it
    # (`sudo chown 65532:65532 output keys`).
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./output:/app/output
      - ./keys:/app/keys
    restart: "no"
