services:
  dicom-deidentifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dicom-deidentifier
    environment:
      - SKALD_DATA_DIR=/app/data
      - SKALD_CONFIG_DIR=/app/config
      - SKALD_OUTPUT_DIR=/app/output
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./output:/app/output
    restart: "no"
